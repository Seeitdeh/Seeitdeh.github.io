# Deploys the website to Firebase Hosting (project outsiide-prod).
#   push to main         -> live site (outsiide-prod.web.app, then outsiide.ca after DNS cutover)
#   pull request         -> preview channel pr-<number>, expires after 7 days
#
# Authenticates with Workload Identity Federation. There is no JSON key.
# One-time setup in the repo (Settings > Secrets and variables > Actions > Variables):
#   GCP_WORKLOAD_IDENTITY_PROVIDER  terraform output site_deploy_workload_identity_provider
#   GCP_SERVICE_ACCOUNT             terraform output site_deployer_service_account
# The site repo holds no web-page assets: /post/** and /web/** are rewritten to
# the backend on Cloud Run (see firebase.json), so backend releases never touch this repo.

name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  pull_request:

# One deploy at a time per ref. Never cancel a running live deploy.
concurrency:
  group: hosting-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # WIF token exchange
  pull-requests: write # preview URL comment

env:
  # Pinned so a new CLI release cannot change deploy behaviour unnoticed.
  FIREBASE_TOOLS_VERSION: 15.24.0
  PROJECT_ID: outsiide-prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Pull requests from forks get no OIDC token; skip them instead of failing.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Deploy live
        if: github.event_name == 'push'
        run: npx --yes firebase-tools@${FIREBASE_TOOLS_VERSION} deploy --only hosting --project "$PROJECT_ID" --non-interactive

      - name: Deploy preview channel
        id: preview
        if: github.event_name == 'pull_request'
        run: |
          npx --yes firebase-tools@${FIREBASE_TOOLS_VERSION} hosting:channel:deploy "pr-${{ github.event.number }}" \
            --project "$PROJECT_ID" --expires 7d --non-interactive --json > preview.json
          url=$(node -p "Object.values(require('./preview.json').result)[0].url")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # The site must keep serving the association file as JSON with no redirect,
      # or iOS universal links silently stop working.
      - name: Smoke test association files
        env:
          BASE_URL: ${{ steps.preview.outputs.url || format('https://{0}.web.app', env.PROJECT_ID) }}
        run: |
          set -eu
          for path in /.well-known/apple-app-site-association /.well-known/assetlinks.json; do
            out=$(curl -sS -o /dev/null -w '%{http_code} %{content_type}' "$BASE_URL$path")
            echo "$path -> $out"
            case "$out" in "200 application/json"*) ;; *) echo "::error::$path is not 200 application/json"; exit 1 ;; esac
          done

      - name: Comment preview URL
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.number }}" --body "Preview (expires in 7 days): ${{ steps.preview.outputs.url }}"
